
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HORA TV - Stream Manager</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #05080d;
  color: #fff;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px 50px;
}


/* ================================
   HEADER
================================ */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 30px;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  color: #fff;
}

.logo span {
  color: #1683ff;
}

.subtitle {
  color: #8c98a8;
  font-size: 13px;
}


/* ================================
   SEARCH
================================ */

.search-box {
  width: 100%;
  margin-bottom: 25px;
}

.search-box input {
  width: 100%;
  padding: 14px 16px;
  background: #0c121b;
  border: 1px solid #1c2938;
  border-radius: 8px;
  color: #fff;
  font-size: 15px;
  outline: none;
}

.search-box input:focus {
  border-color: #1683ff;
}


/* ================================
   SECTION
================================ */

.section {
  margin-bottom: 35px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 1px solid #172231;
}

.section-title h2 {
  margin: 0;
  font-size: 19px;
}

.section-title span {
  font-size: 20px;
}


/* ================================
   MATCH CARD
================================ */

.match-card {
  background: #0b1119;
  border: 1px solid #172231;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 10px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  transition: 0.2s;
}

.match-card:hover {
  border-color: #1683ff;
}

.match-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.team-logos {
  display: flex;
  align-items: center;
  gap: 5px;
}

.team-logos img {
  width: 35px;
  height: 35px;
  object-fit: contain;
  background: #fff;
  border-radius: 50%;
  padding: 3px;
}

.teams {
  font-weight: 600;
}

.meta {
  margin-top: 5px;
  color: #7f8b9a;
  font-size: 12px;
}


/* ================================
   MANAGE BUTTON
================================ */

.manage-btn {
  border: none;
  background: #1683ff;
  color: #fff;
  padding: 10px 15px;
  border-radius: 7px;
  font-weight: 700;
  cursor: pointer;
}

.manage-btn:hover {
  background: #006ee6;
}


/* ================================
   EMPTY
================================ */

.empty {
  padding: 25px;
  text-align: center;
  color: #758194;
  background: #0b1119;
  border-radius: 8px;
}


/* ================================
   STREAM MODAL
================================ */

.stream-modal-overlay {

  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, 0.80);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 9999;

}


.stream-modal {

  width: 100%;

  max-width: 560px;

  max-height: 90vh;

  overflow-y: auto;

  background: #0b1119;

  border: 1px solid #1683ff;

  border-radius: 12px;

  padding: 22px;

  box-shadow:
    0 0 30px rgba(22, 131, 255, 0.25);

}


/* ================================
   MODAL HEADER
================================ */

.stream-modal-header {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  margin-bottom: 22px;

}


.stream-title {

  font-size: 21px;

  font-weight: 700;

  color: #fff;

}


.stream-subtitle {

  margin-top: 5px;

  font-size: 12px;

  color: #7f8b9a;

}


.stream-close {

  width: 35px;

  height: 35px;

  border: none;

  border-radius: 6px;

  background: #151d28;

  color: #aaa;

  font-size: 25px;

  cursor: pointer;

}


.stream-close:hover {

  background: #202b3a;

  color: #fff;

}


/* ================================
   SERVER ITEM
================================ */

.server-item {

  background: #111923;

  border: 1px solid #1c2938;

  border-radius: 9px;

  padding: 14px;

  margin-bottom: 12px;

}


.server-top {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 8px;

}


.server-number {

  color: #1683ff;

  font-size: 14px;

  font-weight: 700;

}


.server-name,
.server-url {

  width: 100%;

  background: #080d13;

  color: #fff;

  border: 1px solid #263547;

  border-radius: 6px;

  padding: 11px;

  margin-top: 8px;

  outline: none;

  font-size: 14px;

}


.server-name:focus,
.server-url:focus {

  border-color: #1683ff;

}


.server-url {

  font-family: Arial, Helvetica, sans-serif;

}


/* ================================
   DELETE BUTTON
================================ */

.delete-server-btn {

  background: transparent;

  border: 1px solid #3a2a2a;

  color: #ff6666;

  padding: 6px 10px;

  border-radius: 5px;

  cursor: pointer;

  font-size: 12px;

}


.delete-server-btn:hover {

  background: #241010;

  border-color: #ff6666;

}


/* ================================
   ADD SERVER
================================ */

.add-server-btn {

  width: 100%;

  background: transparent;

  border: 1px dashed #1683ff;

  color: #1683ff;

  padding: 12px;

  border-radius: 7px;

  cursor: pointer;

  font-weight: 600;

  margin-top: 4px;

}


.add-server-btn:hover {

  background: rgba(22, 131, 255, 0.08);

}


/* ================================
   SAVE
================================ */

.save-stream-btn {

  width: 100%;

  background: #1683ff;

  border: none;

  color: #fff;

  padding: 13px;

  border-radius: 7px;

  cursor: pointer;

  font-weight: 700;

  margin-top: 14px;

}


.save-stream-btn:hover {

  background: #006ee6;

}


/* ================================
   NO SERVERS
================================ */

.no-servers {

  text-align: center;

  color: #758194;

  padding: 25px 10px;

  border: 1px dashed #263547;

  border-radius: 8px;

  margin-bottom: 12px;

}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

  .header {

    align-items: flex-start;

    flex-direction: column;

    gap: 5px;

  }


  .match-card {

    align-items: flex-start;

    gap: 15px;

    flex-direction: column;

  }


  .manage-btn {

    width: 100%;

  }


  .stream-modal {

    padding: 17px;

  }


  .stream-title {

    font-size: 18px;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div>

      <div class="logo">
        HORA <span>TV</span>
      </div>

      <div class="subtitle">
        Stream Manager
      </div>

    </div>


    <div class="subtitle">
      Admin Panel
    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="searchBox"
      placeholder="Search matches..."
      oninput="filterMatches()"
    >

  </div>


  <!-- MATCHES -->

  <div id="matchesContainer">

    <div class="empty">
      Loading matches...
    </div>

  </div>


</div>


<script>


/* ================================
   CONFIG
================================ */

const API_URLS = {

  cricket: '../cricket.json',

  football: '../football.json',

  other: '../others.json'

};


const STREAMS_URL =
  'https://hora-tv-stream-api.dailylivescoress.workers.dev/streams';


let allMatches = [];

let existingStreams = {};


/* ================================
   MATCH ID
================================ */

function makeMatchId(team1, team2) {

  return `${team1}-vs-${team2}`

    .toLowerCase()

    .replace(/[^a-z0-9]+/g, "-")

    .replace(/^-|-$/g, "");

}


/* ================================
   LOAD DATA
================================ */

async function loadData() {

  try {

    const files = [
  ['cricket', '../cricket.json'],
  ['football', '../football.json'],
  ['other', '../others.json'],
  [
    'streams',
    'https://hora-tv-stream-api.dailylivescoress.workers.dev/streams?t=' + Date.now()
  ]
];


    const data = {};


    for (const [name, url] of files) {

      console.log(
        'Loading:',
        name,
        url
      );


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          name +
          '.json returned HTTP ' +
          response.status
        );

      }


      const text =
        await response.text();


      try {

        data[name] =
          JSON.parse(text);

      }

      catch (e) {

        throw new Error(
          name +
          '.json has invalid JSON: ' +
          e.message
        );

      }

    }


    existingStreams =
      data.streams || {};


    allMatches = [

      ...normaliseMatches(
        data.cricket,
        'cricket'
      ),

      ...normaliseMatches(
        data.football,
        'football'
      ),

      ...normaliseMatches(
        data.other,
        'other'
      )

    ];


    renderMatches();

  }


  catch (error) {

    console.error(
      'STREAM MANAGER ERROR:',
      error
    );


    document.getElementById(
      'matchesContainer'
    ).innerHTML = `

      <div class="empty">

        Failed to load match data.

        <br><br>

        <small>
          ${escapeHTML(error.message)}
        </small>

      </div>

    `;

  }

}


/* ================================
   NORMALISE
================================ */

function normaliseMatches(data, sport) {

  let matches = [];


  if (Array.isArray(data)) {

    matches = data;

  }


  else if (
    data &&
    Array.isArray(data.matches)
  ) {

    matches = data.matches;

  }


  else if (
    data &&
    typeof data === 'object'
  ) {

    matches = [data];

  }


  return matches.map(match => ({

    ...match,

    sport:
      match.sport || sport,

    matchId:
      makeMatchId(
        match.team1,
        match.team2
      )

  }));

}


/* ================================
   RENDER MATCHES
================================ */

function renderMatches() {

  const container =
    document.getElementById(
      'matchesContainer'
    );


  const search =
    document.getElementById(
      'searchBox'
    ).value
      .toLowerCase()
      .trim();


  let matches =
  allMatches.filter(match => {

    /* ================================
       REMOVE MATCHES 12 HOURS
       AFTER COMPLETION
    ================================= */

    const startTime =
      new Date(match.start_time).getTime();

    const duration =
      Number(match.duration || 120);

    const endTime =
      startTime +
      duration * 60 * 1000;

    const removeAfter =
      endTime +
      12 * 60 * 60 * 1000;

    const now =
      Date.now();


    /* Ignore matches that are more than
       12 hours past their completion */

    if (
      !isNaN(startTime) &&
      now >= removeAfter
    ) {

      return false;

    }


    /* ================================
       SEARCH
    ================================= */

    const text = `

      ${match.team1}

      ${match.team2}

      ${match.league}

      ${match.format}

    `.toLowerCase();


    return text.includes(search);

  });


  if (!matches.length) {

    container.innerHTML = `

      <div class="empty">
        No matches found.
      </div>

    `;

    return;

  }


  matches.sort((a, b) => {

    return new Date(a.start_time)
      - new Date(b.start_time);

  });


  let cricketHTML = '';

  let footballHTML = '';

  let otherHTML = '';


  matches.forEach(match => {

    const card =
      createMatchCard(match);


    if (match.sport === 'cricket') {

      cricketHTML += card;

    }

    else if (
      match.sport === 'football'
    ) {

      footballHTML += card;

    }

    else {

      otherHTML += card;

    }

  });


  let html = '';


  if (cricketHTML) {

    html += `

      <div class="section">

        <div class="section-title">

          <span>🏏</span>

          <h2>Cricket</h2>

        </div>

        ${cricketHTML}

      </div>

    `;

  }


  if (footballHTML) {

    html += `

      <div class="section">

        <div class="section-title">

          <span>⚽</span>

          <h2>Football</h2>

        </div>

        ${footballHTML}

      </div>

    `;

  }


  if (otherHTML) {

    html += `

      <div class="section">

        <div class="section-title">

          <span>🎯</span>

          <h2>Other</h2>

        </div>

        ${otherHTML}

      </div>

    `;

  }


  container.innerHTML = html;

}


/* ================================
   MATCH CARD
================================ */

function createMatchCard(match) {

  const hasStreams =

    existingStreams[match.matchId] &&

    existingStreams[match.matchId].length;


  return `

    <div class="match-card">


      <div class="match-info">


        <div class="team-logos">


          <img
            src="${escapeHTML(match.team1_logo || '')}"
            onerror="this.style.display='none'"
          >


          <img
            src="${escapeHTML(match.team2_logo || '')}"
            onerror="this.style.display='none'"
          >


        </div>


        <div>


          <div class="teams">

            ${escapeHTML(match.team1)}

            vs

            ${escapeHTML(match.team2)}

          </div>


          <div class="meta">

            ${escapeHTML(match.league || '')}

            •

            ${formatDate(match.start_time)}

            •

            ${
              hasStreams
                ? '🟢 Streams Added'
                : '⚪ No Streams'
            }

          </div>


        </div>


      </div>


      <button
        class="manage-btn"
        onclick="manageStreams('${escapeHTML(match.matchId)}')"
      >

        MANAGE

      </button>


    </div>

  `;

}


/* ================================
   SEARCH
================================ */

function filterMatches() {

  renderMatches();

}


/* ================================
   MANAGE STREAMS
================================ */

function manageStreams(matchId) {

  const match =
    allMatches.find(
      m => m.matchId === matchId
    );


  if (!match) {

    alert('Match not found.');

    return;

  }


  const streams =
    existingStreams[matchId] || [];


  let serverHTML = '';


  if (!streams.length) {

    serverHTML = `

      <div
        class="no-servers"
        id="noServers"
      >

        No servers added yet.

      </div>

    `;

  }


  else {

    streams.forEach(
      (stream, index) => {

        serverHTML +=
          createServerHTML(
            index,
            stream
          );

      }
    );

  }


  const modal = `

    <div
      class="stream-modal-overlay"
      id="streamModal"
      onclick="closeStreamModal(event)"
    >


      <div
        class="stream-modal"
        onclick="event.stopPropagation()"
      >


        <div class="stream-modal-header">


          <div>

            <div class="stream-title">

              ${escapeHTML(match.team1)}

              vs

              ${escapeHTML(match.team2)}

            </div>


            <div class="stream-subtitle">

              ${escapeHTML(match.league || '')}

              •

              ${formatDate(match.start_time)}

            </div>

          </div>


          <button
            class="stream-close"
            onclick="closeStreamModal()"
          >

            ×

          </button>


        </div>


        <div id="serverList">

          ${serverHTML}

        </div>


        <button
          class="add-server-btn"
          onclick="addServer()"
        >

          + Add Server

        </button>


        <button
          class="save-stream-btn"
          onclick="saveStreams('${escapeHTML(matchId)}')"
        >

          SAVE CHANGES

        </button>


      </div>

    </div>

  `;


  document.body.insertAdjacentHTML(
    'beforeend',
    modal
  );

}


/* ================================
   CREATE SERVER
================================ */

function createServerHTML(index, stream) {

  const name =
    stream.name ||
    'Server ' + (index + 1);


  const url =
    stream.url || '';


  return `

    <div class="server-item">


      <div class="server-top">

        <div class="server-number">

          Server ${index + 1}

        </div>


        <button
          class="delete-server-btn"
          onclick="deleteServer(this)"
        >

          Delete

        </button>

      </div>


      <input
        type="text"
        class="server-name"
        value="${escapeHTML(name)}"
        placeholder="Server name"
      >


      <input
        type="text"
        class="server-url"
        value="${escapeHTML(url)}"
        placeholder="https://example.com/stream.m3u8"
      >


    </div>

  `;

}


/* ================================
   ADD SERVER
================================ */

function addServer() {

  const list =
    document.getElementById(
      'serverList'
    );


  if (!list) return;


  const noServers =
    document.getElementById(
      'noServers'
    );


  if (noServers) {

    noServers.remove();

  }


  const count =
    list.querySelectorAll(
      '.server-item'
    ).length;


  list.insertAdjacentHTML(

    'beforeend',

    createServerHTML(

      count,

      {
        name:
          'Server ' +
          (count + 1),

        url: ''

      }

    )

  );

}


/* ================================
   DELETE SERVER
================================ */

function deleteServer(button) {

  const server =
    button.closest(
      '.server-item'
    );


  if (!server) return;


  server.remove();


  renumberServers();

}


/* ================================
   RENUMBER
================================ */

function renumberServers() {

  const servers =
    document.querySelectorAll(
      '#serverList .server-item'
    );


  servers.forEach(
    (server, index) => {

      const number =
        server.querySelector(
          '.server-number'
        );


      if (number) {

        number.textContent =
          'Server ' +
          (index + 1);

      }


      const nameInput =
        server.querySelector(
          '.server-name'
        );


      if (
        nameInput &&
        !nameInput.value.trim()
      ) {

        nameInput.value =
          'Server ' +
          (index + 1);

      }

    }
  );

}


/* ================================
   SAVE STREAMS
================================ */

async function saveStreams(matchId) {

  const servers = [];

  document
    .querySelectorAll('#serverList .server-item')
    .forEach(server => {

      const nameInput =
        server.querySelector('.server-name');

      const urlInput =
        server.querySelector('.server-url');

      const name =
        nameInput.value.trim();

      const url =
        urlInput.value.trim();

      if (url) {

        servers.push({
          name:
            name ||
            'Server ' +
            (servers.length + 1),

          url: url
        });

      }
    });


  // Save the streams in browser memory first
  existingStreams[matchId] = servers;


  // Ask for Admin Key
  const adminKey =
    prompt('Enter HORA TV Admin Key:');


  if (!adminKey) {

    alert('Save cancelled.');

    return;
  }


  try {

    const response =
      await fetch(
        STREAMS_URL,
        {
          method: 'PUT',

          headers: {
            'Content-Type':
              'application/json',

            'X-Admin-Key':
              adminKey
          },

          body:
            JSON.stringify(
              existingStreams
            )
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      console.error(
        'Save error:',
        result
      );

      alert(
        'Save failed: ' +
        (
          result.error ||
          'Unknown error'
        )
      );

      return;
    }


    closeStreamModal();

    renderMatches();


    alert(
      'Streams saved successfully!'
    );


  } catch (error) {

    console.error(
      'Worker error:',
      error
    );

    alert(
      'Could not connect to Stream API.'
    );
  }
}

/* ================================
   CLOSE MODAL
================================ */

function closeStreamModal() {

  const modal =
    document.getElementById(
      'streamModal'
    );


  if (modal) {

    modal.remove();

  }

}


/* ================================
   MODAL BACKDROP
================================ */

function closeStreamModalOnBackdrop(event) {

  if (
    event.target.classList.contains(
      'stream-modal-overlay'
    )
  ) {

    closeStreamModal();

  }

}


/* ================================
   DATE
================================ */

function formatDate(dateString) {

  const date =
    new Date(dateString);


  if (isNaN(date)) {

    return 'Date unavailable';

  }


  return date.toLocaleString(

    'en-US',

    {

      day: '2-digit',

      month: 'short',

      hour: '2-digit',

      minute: '2-digit'

    }

  );

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value) {

  return String(value || '')

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* ================================
   START
================================ */

loadData();

</script>

</body>
</html>
